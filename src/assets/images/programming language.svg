<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="symbol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".14"/>
    </filter>
  </defs>

  <!-- General programming concept: no language-specific logos or names -->
  <!-- Abstract gear -->
  <g transform="translate(575 105)" opacity=".28" fill="#4F46E5">
    <path d="M0-52l14 5 8-12 22 13-5 14 11 9 14-5 8 24-14 7 1 14 14 7-9 24-15-4-9 11 5 14-22 13-9-12-14 4-5 14h-25l-5-14-14-4-9 12-22-13 5-14-11-11-15 4-9-24 14-7 1-14-14-7 8-24 15 5 11-9-5-14 22-13 8 12 14-5z"/>
    <circle cx="0" cy="0" r="25" fill="#F8FAFC"/>
  </g>

  <!-- Code editor -->
  <g filter="url(#shadow)">
    <rect x="155" y="105" width="490" height="300" rx="26" fill="url(#screen)"/>
    <path d="M155 131a26 26 0 0 1 26-26h438a26 26 0 0 1 26 26v42H155z" fill="#1E3A5F"/>
    <circle cx="190" cy="134" r="8" fill="#F87171"/>
    <circle cx="216" cy="134" r="8" fill="#FBBF24"/>
    <circle cx="242" cy="134" r="8" fill="#34D399"/>

    <!-- Abstract syntax -->
    <g opacity=".95">
      <rect x="205" y="195" width="58" height="10" rx="5" fill="#60A5FA"/>
      <rect x="277" y="195" width="150" height="10" rx="5" fill="#64748B"/>
      <rect x="440" y="195" width="82" height="10" rx="5" fill="#34D399"/>

      <rect x="205" y="228" width="34" height="10" rx="5" fill="#A78BFA"/>
      <rect x="252" y="228" width="105" height="10" rx="5" fill="#38BDF8"/>
      <rect x="370" y="228" width="125" height="10" rx="5" fill="#64748B"/>

      <rect x="205" y="261" width="85" height="10" rx="5" fill="#22C55E"/>
      <rect x="302" y="261" width="145" height="10" rx="5" fill="#64748B"/>

      <rect x="205" y="294" width="48" height="10" rx="5" fill="#F472B6"/>
      <rect x="266" y="294" width="110" height="10" rx="5" fill="#60A5FA"/>
      <rect x="389" y="294" width="105" height="10" rx="5" fill="#64748B"/>

      <rect x="205" y="327" width="118" height="10" rx="5" fill="#A78BFA"/>
      <rect x="335" y="327" width="140" height="10" rx="5" fill="#64748B"/>
      <rect x="205" y="360" width="70" height="10" rx="5" fill="#38BDF8"/>
      <rect x="288" y="360" width="165" height="10" rx="5" fill="#64748B"/>
    </g>
  </g>

  <!-- Generic floating symbols only -->
  <g fill="#2563EB" opacity=".45" font-family="monospace" font-weight="700">
    <text x="650" y="250" font-size="38">{ }</text>
    <text x="90" y="390" font-size="34">( )</text>
    <text x="655" y="360" font-size="34">[ ]</text>
  </g>

  <!-- Decorative connection nodes -->
  <g fill="#7C3AED" opacity=".5">
    <circle cx="112" cy="270" r="5"/>
    <circle cx="686" cy="290" r="5"/>
    <circle cx="620" cy="70" r="5"/>
  </g>
  <g stroke="#93C5FD" stroke-width="2" opacity=".55">
    <path d="M112 270 L155 250"/>
    <path d="M686 290 L645 275"/>
    <path d="M620 70 L575 105"/>
  </g>
</svg>
